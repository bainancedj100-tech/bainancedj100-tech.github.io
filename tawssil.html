<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tawssil Tiaret — الرحلة الأرخص في تيارت</title>
  <meta name="description" content="حمّل تطبيق تواصل تيارت الآن — خدمة النقل الأرخص في تيارت." />

  <!-- Open Graph for Facebook/WhatsApp preview -->
  <meta property="og:title" content="Tawssil Tiaret 🚗" />
  <meta property="og:description" content="الرحلة الأرخص في تيارت — حمّل التطبيق الآن من Google Play" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bainancedj100-tech.github.io/tawssil" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cairo', sans-serif;
      background: #0d1117;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(255,200,0,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(255,200,0,0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,200,0,0.2);
      border-radius: 28px;
      padding: 48px 36px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(255,200,0,0.08), 0 24px 60px rgba(0,0,0,0.5);
      animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 8px 30px rgba(255,200,0,0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 30px rgba(255,200,0,0.4); }
      50%       { box-shadow: 0 8px 50px rgba(255,200,0,0.7); }
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      color: #FFD700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 15px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 32px;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #FFD700;
    }

    .stat-label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }

    .divider {
      width: 1px;
      background: rgba(255,255,255,0.1);
    }

    .btn-play {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px 24px;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #1a1200;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 25px rgba(255,200,0,0.35);
    }

    .btn-play:hover, .btn-play:active {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 35px rgba(255,200,0,0.5);
    }

    .btn-play svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .open-browser-note {
      display: none;
      margin-top: 20px;
      background: rgba(255,200,0,0.1);
      border: 1px solid rgba(255,200,0,0.3);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      line-height: 1.6;
    }

    .open-browser-note strong {
      color: #FFD700;
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .copy-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 18px;
      background: #FFD700;
      color: #1a1200;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .copy-btn:active { opacity: 0.7; }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>

<div class="card">

  <div class="logo">🐎</div>

  <h1>Tawssil Tiaret</h1>
  <p class="tagline">الرحلة الأرخص في تيارت<br/>احجز رحلتك بلمسة واحدة</p>

  <div class="stats">
    <div class="stat">
      <div class="stat-value">🆓</div>
      <div class="stat-label">مجاني</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="stat-value">⚡</div>
      <div class="stat-label">سريع</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="stat-value">🔒</div>
      <div class="stat-label">آمن</div>
    </div>
  </div>

  <a class="btn-play" id="playBtn" href="#" onclick="openPlayStore(event)">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M3.18 23.77C3.06 23.7 3 23.56 3 23.37V.63C3 .44 3.06.3 3.18.23L3.25.2l12.76 11.6v.4L3.25 23.8l-.07-.03z"/>
      <path d="M20.23 15.83l-3.29-1.88-3.68 3.34 3.68 3.34 3.3-1.88a1.88 1.88 0 000-2.92z"/>
      <path d="M3.18.23l12.84 11.65-3.68 3.34L3.18.23z"/>
      <path d="M3.18 23.77l9.16-8.31 3.68 3.34L3.18 23.77z"/>
    </svg>
    حمّل من Google Play
  </a>

  <!-- Shown only in Facebook/Instagram in-app browser -->
  <div class="open-browser-note" id="browserNote">
    <strong>⚠️ افتح في المتصفح</strong>
    لفتح Google Play، اضغط على النقاط (⋮) في الأعلى واختر
    <em>"فتح في المتصفح"</em> أو انسخ الرابط:
    <br/>
    <button class="copy-btn" onclick="copyLink()">📋 نسخ الرابط</button>
  </div>

  <p class="footer">Tawssil Tiaret © 2026 — KHALED TOP</p>
</div>

<script>
  const PLAY_URL  = 'https://play.google.com/apps/test/RQk2dmmITgU/ahAO29uNRlyu2WStX1fBtBs8fYWm6ocBi8bO4VV0Hoc-7oBvhjzqL59x5t0nZsAAPgvo9Aki4XnKUVyIMjpcdpSx1x';
  const MARKET_URL = 'https://play.google.com/apps/test/RQk2dmmITgU/ahAO29uNRlyu2WStX1fBtBs8fYWm6ocBi8bO4VV0Hoc-7oBvhjzqL59x5t0nZsAAPgvo9Aki4XnKUVyIMjpcdpSx1x';

  // Detect Facebook / Instagram / any in-app browser
  function isInAppBrowser() {
    const ua = navigator.userAgent || '';
    return /FBAN|FBAV|FBDV|Instagram|FB_IAB|FBIOS|FB4A|Messenger|LinkedInApp|Twitter|Snapchat|TikTok|Pinterest/i.test(ua);
  }

  // Try to open Play Store app via market:// then fallback to web
  function openPlayStore(e) {
    e.preventDefault();

    if (isInAppBrowser()) {
      // Can't open external apps from in-app browser — show instructions
      document.getElementById('browserNote').style.display = 'block';
      document.getElementById('browserNote').scrollIntoView({ behavior: 'smooth' });
      return;
    }

    // Try market:// (opens Play Store app directly on Android)
    const isAndroid = /android/i.test(navigator.userAgent);
    if (isAndroid) {
      // Use iframe trick to try market:// without navigation error
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = MARKET_URL;
      document.body.appendChild(iframe);
      // Fallback to web after short delay
      setTimeout(function () {
        document.body.removeChild(iframe);
        window.location.href = PLAY_URL;
      }, 1500);
    } else {
      // iOS or desktop — open web URL
      window.open(PLAY_URL, '_blank');
    }
  }

  window.addEventListener('DOMContentLoaded', function () {
    if (isInAppBrowser()) {
      document.getElementById('browserNote').style.display = 'block';
    }
  });

  function copyLink() {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(PLAY_URL).then(function () {
        alert('✅ تم نسخ الرابط!\nافتح متصفحك (Chrome) والصق الرابط.');
      });
    } else {
      const el = document.createElement('textarea');
      el.value = PLAY_URL;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      alert('✅ تم نسخ الرابط!\nافتح متصفحك (Chrome) والصق الرابط.');
    }
  }
</script>

</body>
</html>
